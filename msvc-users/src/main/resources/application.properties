spring.application.name=msvc-users

# Configuración Eureka
server.port=${PORT:0}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_spring_cloud?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=julio
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Propiedades de Hibernate (JPA)
# O puedes usar 'validate', 'create', 'create-drop' seg�n tus necesidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

